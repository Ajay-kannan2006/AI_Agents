version: '3.8'

services:
  interview-coach-agent:
    build: .
    container_name: interview_coach_agent
    ports:
      - "8001:8001"
    environment:
      - APP_NAME=Interview Coach Agent
      - APP_ENV=production
      - DEBUG=false
      - PORT=8001
      - HOST=0.0.0.0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DATABASE_URL=sqlite+aiosqlite:///./data/storage.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
