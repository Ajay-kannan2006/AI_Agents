version: '3.8'

services:
  research-agent:
    build: .
    container_name: research_agent
    ports:
      - "8002:8002"
    environment:
      - APP_NAME=Research Agent
      - APP_ENV=production
      - DEBUG=false
      - PORT=8002
      - HOST=0.0.0.0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DATABASE_URL=sqlite+aiosqlite:///./data/storage.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
