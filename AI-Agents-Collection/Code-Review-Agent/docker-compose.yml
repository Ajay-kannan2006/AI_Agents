version: '3.8'

services:
  code-review-agent:
    build: .
    container_name: code_review_agent
    ports:
      - "8004:8004"
    environment:
      - APP_NAME=Code Review Agent
      - APP_ENV=production
      - DEBUG=false
      - PORT=8004
      - HOST=0.0.0.0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DATABASE_URL=sqlite+aiosqlite:///./data/storage.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
